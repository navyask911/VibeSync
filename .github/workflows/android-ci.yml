name: VibeSync Android Release CI
# Release verification deliberately uses JVM tests plus signed APK/AAB packaging; no emulator gate.
# Primary release gate: source, JVM/Compose tests, signing, APK/AAB packaging and artifact verification.

on:
  push:
    branches:
      - main
      - vibesync-production
      - vibesync-hardening-2026-10-07
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: vibesync-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  VIBESYNC_PACKAGE_NAME: "com.aistudio.freedating.mkwvxq"
  VIBESYNC_TRUECALLER_CLIENT_ID: "z3rfwgowtpkt-4_5hmsogbcjf2wc8igmb_bjpvzk8xc"
  VIBESYNC_CONSENT_LABEL: "VIBESYNC"
  VIBESYNC_RELEASE_SHA256: "99:99:23:2C:62:30:12:15:54:CC:30:EA:D8:EB:0E:95:9F:DA:52:64"

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache/setup
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Secret scan
        run: |
          set -o pipefail
          if find . -type f \
              \( -name "*.kt" -o -name "*.java" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.xml" -o -name "*.properties" \) \
              ! -path "./.git/*" \
              ! -path "./source-archive/*" \
              ! -path "./.github/*" \
              ! -path "./build/*" \
              ! -path "./app/build/*" \
              ! -path "./app/google-services.json" \
              -print0 | xargs -0 -r grep -nH -E "\"private_key\"[[:space:]]*:[[:space:]]*\"-----BEGIN|AIzaSy[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" 2>/dev/null; then
            echo "Credential value pattern found in application source"
            exit 1
          fi

      - name: Verify production Truecaller wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'applicationId = "com.aistudio.freedating.mkwvxq"' app/build.gradle.kts
          grep -F 'implementation("com.truecaller.android.sdk:truecaller-sdk:3.2.1")' app/build.gradle.kts
          grep -F 'android:name="com.truecaller.android.sdk.ClientId"' app/src/main/AndroidManifest.xml
          grep -F 'android:value="z3rfwgowtpkt-4_5hmsogbcjf2wc8igmb_bjpvzk8xc"' app/src/main/AndroidManifest.xml
          grep -F '<string name="app_name">VIBESYNC</string>' app/src/main/res/values/strings.xml
          grep -F 'EXPECTED_PACKAGE = "com.aistudio.freedating.mkwvxq"' app/src/main/java/com/example/util/TruecallerVerificationClient.kt
          grep -F 'EXPECTED_CLIENT_ID = "z3rfwgowtpkt-4_5hmsogbcjf2wc8igmb_bjpvzk8xc"' app/src/main/java/com/example/util/TruecallerVerificationClient.kt
          grep -F 'BuildConfig.DEBUG && enableSimulatedOtpForTesting' app/src/main/java/com/example/ui/screens/OtpVerificationScreen.kt
          grep -F 'simulatedOtpCode = null' app/src/main/java/com/example/ui/DatingAppRoot.kt

          if grep -R -n -E '9449878908|919449878908' app/src/main/java app/src/main/res 2>/dev/null; then
            echo "Known Truecaller test number leaked into production app source."
            exit 1
          fi

          if grep -R -n 'com.truecaller.android.sdk.PartnerKey' app/src/main 2>/dev/null; then
            echo "Legacy Truecaller PartnerKey metadata must not be present in the OAuth build."
            exit 1
          fi

      - name: JVM unit + Compose UI tests
        run: ./gradlew clean test -Djava.awt.headless=true --no-daemon

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is required for the signed release gate."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "KEYSTORE_PASSWORD and KEY_PASSWORD secrets are required for the signed release gate."
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/vibesync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          SIGNING_ALIAS="$KEY_ALIAS"
          if [ -z "$SIGNING_ALIAS" ]; then SIGNING_ALIAS="upload"; fi
          CERT_SHA256=$(keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$SIGNING_ALIAS" \
            | awk -F": " '/SHA256:/{print $2; exit}' | tr -d "\r")
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$VIBESYNC_RELEASE_SHA256"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon -Djava.awt.headless=true assembleRelease --rerun-tasks

      - name: Build signed release AAB
        run: ./gradlew --no-daemon -Djava.awt.headless=true bundleRelease --rerun-tasks

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          APK=(app/build/outputs/apk/release/*.apk)
          AAB=(app/build/outputs/bundle/release/*.aab)

          test -f "${APK[0]}"
          test -f "${AAB[0]}"

          echo "Release APK:"
          ls -lh "${APK[0]}"

          echo "Release AAB:"
          ls -lh "${AAB[0]}"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "${APK[0]}" \
            | grep -F "Signer #1 certificate SHA-256 digest: $VIBESYNC_RELEASE_SHA256"

      - name: Upload APK, AAB and test reports
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android-Release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/test/**/*.xml

name: VibeSync Android Release CI
# Fast active-development lane: tests, signing and release APK verification only.
# AAB packaging and emulator/UI smoke tests are deferred until the production release.

on:
  push:
    branches:
      - main
      - vibesync-production
      - vibesync-hardening-2026-10-07
      - fix/release-startup-icons-ci
    paths:
      - "app/**"
      - ".env.example"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: vibesync-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  VIBESYNC_PACKAGE_NAME: "com.aistudio.freedating.mkwvxq"
  VIBESYNC_TRUECALLER_CLIENT_ID: "qkpfffgkiebypf8hvifhkkknj2msgud5hfjqg_ti1wu"
  VIBESYNC_CONSENT_LABEL: "VIBESYNC DEV"
  VIBESYNC_RELEASE_SHA1: "EF:21:E5:62:29:D7:00:94:D1:95:90:D4:F5:9E:6B:5C:AF:8A:DA:6A"
  VIBESYNC_RELEASE_SHA256: "5A:7A:47:9D:46:C1:AB:C5:1B:E5:7A:C3:A2:08:F2:41:4A:7E:B7:11:E4:59:A2:BE:BF:B7:BA:F5:4D:4A:CC:73"

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare app config and validate packaged resources
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          defaults = {}
          for raw in Path(".env.example").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              defaults[key.strip()] = value.strip()

          values = {
              "SUPABASE_URL": os.environ.get("SUPABASE_URL_SECRET", "").strip() or defaults.get("SUPABASE_URL", ""),
              "SUPABASE_ANON_KEY": os.environ.get("SUPABASE_ANON_KEY_SECRET", "").strip() or defaults.get("SUPABASE_ANON_KEY", ""),
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY_SECRET", "").strip() or defaults.get("GEMINI_API_KEY", ""),
          }
          for key, value in values.items():
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"Invalid or missing build configuration: {key}")
          if not values["SUPABASE_URL"].startswith("https://"):
              raise SystemExit("SUPABASE_URL must use HTTPS")

          # Never print these values: .env feeds generated BuildConfig constants.
          Path(".env").write_text(
              "# Generated by GitHub Actions; do not commit.\n" +
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )

          google_services = Path("app/google-services.json")
          supplied_json = "".join(os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").split())
          if supplied_json:
              try:
                  decoded = base64.b64decode(supplied_json, validate=True)
                  json.loads(decoded)
              except Exception as exc:
                  raise SystemExit("GOOGLE_SERVICES_JSON_BASE64 is not valid base64-encoded JSON") from exc
              google_services.write_bytes(decoded)
          if not google_services.is_file():
              raise SystemExit("Missing app/google-services.json and GOOGLE_SERVICES_JSON_BASE64 secret")

          package_match = re.search(r'applicationId\s*=\s*"([^"]+)"', Path("app/build.gradle.kts").read_text(encoding="utf-8"))
          if not package_match:
              raise SystemExit("Could not determine Android applicationId")
          app_id = package_match.group(1)
          try:
              google_config = json.loads(google_services.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit("app/google-services.json is not valid JSON") from exc

          configured_packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in google_config.get("client", [])
          }
          if app_id not in configured_packages:
              raise SystemExit("Google Services package_name does not match Android applicationId")

          android_ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          application = manifest.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml is missing <application>")
          expected_icons = {
              "icon": "@mipmap/ic_launcher",
              "roundIcon": "@mipmap/ic_launcher_round",
          }
          for attribute, expected in expected_icons.items():
              actual = application.get(android_ns + attribute)
              if actual != expected:
                  raise SystemExit(f"AndroidManifest.xml android:{attribute} must be {expected}, found {actual!r}")

          # Launcher icons from AppIcons(3).zip: all density fallbacks plus Android adaptive icons.
          required_icon_paths = [
              "app/src/main/res/mipmap-mdpi/ic_launcher.webp",
              "app/src/main/res/mipmap-mdpi/ic_launcher_round.webp",
              "app/src/main/res/mipmap-hdpi/ic_launcher.webp",
              "app/src/main/res/mipmap-hdpi/ic_launcher_round.webp",
              "app/src/main/res/mipmap-xhdpi/ic_launcher.webp",
              "app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp",
              "app/src/main/res/mipmap-xxhdpi/ic_launcher.webp",
              "app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp",
              "app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp",
              "app/src/main/res/values/ic_launcher_background.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]
          missing_icons = [path for path in required_icon_paths if not Path(path).is_file()]
          if missing_icons:
              raise SystemExit("Missing VibeSync launcher icon assets: " + ", ".join(missing_icons))

          for adaptive_path in (
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ):
              adaptive = ET.parse(adaptive_path).getroot()
              background = adaptive.find("background")
              foreground = adaptive.find("foreground")
              if background is None or background.get(android_ns + "drawable") != "@color/ic_launcher_background":
                  raise SystemExit(f"{adaptive_path} must reference @color/ic_launcher_background")
              if foreground is None or foreground.get(android_ns + "drawable") != "@drawable/ic_launcher_foreground":
                  raise SystemExit(f"{adaptive_path} must reference @drawable/ic_launcher_foreground")

          print("App config, Google Services package and supplied VibeSync launcher icon resources validated.")

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache/setup
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Secret scan
        run: |
          set -o pipefail
          if find . -type f \
              \( -name "*.kt" -o -name "*.java" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.xml" -o -name "*.properties" \) \
              ! -path "./.git/*" \
              ! -path "./source-archive/*" \
              ! -path "./.github/*" \
              ! -path "./build/*" \
              ! -path "./app/build/*" \
              ! -path "./app/google-services.json" \
              -print0 | xargs -0 -r grep -nH -E "\"private_key\"[[:space:]]*:[[:space:]]*\"-----BEGIN|AIzaSy[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" 2>/dev/null; then
            echo "Credential value pattern found in application source"
            exit 1
          fi

      - name: Verify Truecaller wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'applicationId = "com.aistudio.freedating.mkwvxq"' app/build.gradle.kts
          grep -F 'implementation("com.truecaller.android.sdk:truecaller-sdk:3.2.1")' app/build.gradle.kts
          grep -F 'android:name="com.truecaller.android.sdk.ClientId"' app/src/main/AndroidManifest.xml
          grep -F 'android:value="qkpfffgkiebypf8hvifhkkknj2msgud5hfjqg_ti1wu"' app/src/main/AndroidManifest.xml
          grep -F '<string name="app_name">VIBESYNC</string>' app/src/main/res/values/strings.xml
          grep -F 'EXPECTED_PACKAGE = "com.aistudio.freedating.mkwvxq"' app/src/main/java/com/example/util/TruecallerVerificationClient.kt
          grep -F 'EXPECTED_CLIENT_ID = "qkpfffgkiebypf8hvifhkkknj2msgud5hfjqg_ti1wu"' app/src/main/java/com/example/util/TruecallerVerificationClient.kt
          test ! -e app/src/main/java/com/example/ui/screens/OtpVerificationScreen.kt
          if grep -R -n -E 'SupabaseAuthManager|FirebaseAuthHelper|signInWithOtp|verifyOtp|/auth/v1/(otp|verify|token)|Supabase Auth owns|Supabase Auth is authoritative' app/src/main 2>/dev/null; then
            echo "Supabase Auth/SMS OTP login code must not remain in the Android app."
            exit 1
          fi
          grep -F 'const val EXPECTED_CLIENT_ID = "qkpfffgkiebypf8hvifhkkknj2msgud5hfjqg_ti1wu"' app/src/main/java/com/example/util/TruecallerVerificationClient.kt
          # The canonical backend is verify-truecaller; vibesync-truecaller-auth is retired.
          grep -F 'const TRUECALLER_CLIENT_ID = "qkpfffgkiebypf8hvifhkkknj2msgud5hfjqg_ti1wu"' supabase/functions/verify-truecaller/index.ts
          grep -F 'Deno.env.get("TRUECALLER_PARTNER_KEY")' supabase/functions/verify-truecaller/index.ts
          grep -F 'body.code ?? body.authorization_code' supabase/functions/verify-truecaller/index.ts
          grep -F 'put("code", profile.authorizationCode)' app/src/main/java/com/example/util/TruecallerAuthGateway.kt
          grep -F '/functions/v1/verify-truecaller' app/src/main/java/com/example/util/TruecallerAuthGateway.kt
          if grep -R -n -E '9449878908|919449878908' app/src/main/java app/src/main/res --exclude='PhonebookHasher.kt' 2>/dev/null; then
            echo "Known Truecaller test number leaked into production app source."
            exit 1
          fi

          if grep -R -n 'com.truecaller.android.sdk.PartnerKey' app/src/main 2>/dev/null; then
            echo "Legacy Truecaller PartnerKey metadata must not be present in the OAuth build."
            exit 1
          fi

      - name: Compile Debug Kotlin
        run: ./gradlew --no-daemon compileDebugKotlin

      - name: JVM unit + Compose UI tests
        # Avoid "clean" here: compileDebugKotlin already checked the source, and deleting
        # outputs would force the test task to rebuild the same source from scratch.
        run: ./gradlew test -Djava.awt.headless=true --no-daemon

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is required for the signed release gate."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "KEYSTORE_PASSWORD and KEY_PASSWORD secrets are required for the signed release gate."
            exit 1
          fi

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }

          EXPECTED_SHA1=$(normalize_fingerprint "$VIBESYNC_RELEASE_SHA1")
          EXPECTED_SHA256=$(normalize_fingerprint "$VIBESYNC_RELEASE_SHA256")

          KEYSTORE_FILE="${RUNNER_TEMP}/vibesync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          SIGNING_ALIAS="${KEY_ALIAS:-upload}"
          MATCHING_ALIAS=""
          MATCH_COUNT=0

          while IFS= read -r alias; do
            [ -n "$alias" ] || continue

            CERT_SHA1=$(keytool -list -v               -keystore "$KEYSTORE_FILE"               -storepass "$KEYSTORE_PASSWORD"               -alias "$alias"               | awk -F": " '/SHA1:/{print $2; exit}'               | tr -d '[:space:]:'               | tr '[:lower:]' '[:upper:]')

            CERT_SHA256=$(keytool -list -v               -keystore "$KEYSTORE_FILE"               -storepass "$KEYSTORE_PASSWORD"               -alias "$alias"               | awk -F": " '/SHA256:/{print $2; exit}'               | tr -d '[:space:]:'               | tr '[:lower:]' '[:upper:]')

            if [ "$CERT_SHA1" = "$EXPECTED_SHA1" ] && [ "$CERT_SHA256" = "$EXPECTED_SHA256" ]; then
              MATCHING_ALIAS="$alias"
              MATCH_COUNT=$((MATCH_COUNT + 1))
            fi
          done < <(
            keytool -list -v               -keystore "$KEYSTORE_FILE"               -storepass "$KEYSTORE_PASSWORD"               | awk -F": " '/^Alias name:/{print $2}'
          )

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "No unique keystore alias matches the exact production SHA-1/SHA-256 pair."
            echo "Configured alias: $SIGNING_ALIAS"
            echo "Expected SHA-1: $EXPECTED_SHA1"
            echo "Expected SHA-256: $EXPECTED_SHA256"
            exit 1
          fi

          SIGNING_ALIAS="$MATCHING_ALIAS"
          CERT_SHA1=$(keytool -list -v             -keystore "$KEYSTORE_FILE"             -storepass "$KEYSTORE_PASSWORD"             -alias "$SIGNING_ALIAS"             | awk -F": " '/SHA1:/{print $2; exit}'             | tr -d '[:space:]:'             | tr '[:lower:]' '[:upper:]')
          CERT_SHA256=$(keytool -list -v             -keystore "$KEYSTORE_FILE"             -storepass "$KEYSTORE_PASSWORD"             -alias "$SIGNING_ALIAS"             | awk -F": " '/SHA256:/{print $2; exit}'             | tr -d '[:space:]:'             | tr '[:lower:]' '[:upper:]')

          echo "Verified release signing alias: $SIGNING_ALIAS"
          echo "Verified keystore SHA-1: $CERT_SHA1"
          echo "Verified keystore SHA-256: $CERT_SHA256"

          test "$CERT_SHA1" = "$EXPECTED_SHA1"
          test "$CERT_SHA256" = "$EXPECTED_SHA256"

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=(app/build/outputs/apk/release/*.apk)
          test -f "${APK[0]}"

          echo "Signed release APK:"
          ls -lh "${APK[0]}"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          MIN_SDK=$(awk -F'[ =]+' '/^[[:space:]]*minSdk[[:space:]]*=/{print $3; exit}' gradle/libs.versions.toml app/build.gradle.kts)
          MIN_SDK="${MIN_SDK:-24}"

          set +e
          APKSIGNER_CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --min-sdk-version "$MIN_SDK" --print-certs "${APK[0]}" 2>&1)
          APKSIGNER_STATUS=$?
          set -e

          echo "apksigner verify --min-sdk-version $MIN_SDK:"
          printf '%s\n' "$APKSIGNER_CERTS"

          if [ "$APKSIGNER_STATUS" -ne 0 ]; then
            echo "apksigner verification failed for the release APK."
            exit "$APKSIGNER_STATUS"
          fi

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }

          # apksigner's digest labels differ by version; extract the first certificate SHA-1/SHA-256
          # line without requiring a specific signer label. Missing digest text is informational only.
          APK_SHA1=$(printf '%s\n' "$APKSIGNER_CERTS"             | awk -F': ' '/certificate SHA-1 digest:/{print $NF; exit}'             | tr -d '[:space:]:'             | tr '[:lower:]' '[:upper:]')
          APK_SHA256=$(printf '%s\n' "$APKSIGNER_CERTS"             | awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}'             | tr -d '[:space:]:'             | tr '[:lower:]' '[:upper:]')

          echo "APK certificate SHA-1: ${APK_SHA1:-unavailable from apksigner output}"
          echo "APK certificate SHA-256: ${APK_SHA256:-unavailable from apksigner output}"

          # The keystore gate already proved the production certificate pair. When apksigner
          # exposes certificate digests, confirm the packaged APK carries the same pair.
          if [ -n "$APK_SHA1" ]; then
            test "$APK_SHA1" = "$(normalize_fingerprint "$VIBESYNC_RELEASE_SHA1")"
          fi
          if [ -n "$APK_SHA256" ]; then
            test "$APK_SHA256" = "$(normalize_fingerprint "$VIBESYNC_RELEASE_SHA256")"
          fi

          echo "Release APK signature verified."

      - name: Upload signed APK and test reports
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android-Release-APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/**
            app/build/test-results/test/**/*.xml

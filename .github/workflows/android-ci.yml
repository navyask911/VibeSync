name: VibeSync Android CI

on:
  push:
    branches:
      - main
      - vibesync-production
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Secret scan
        run: |
          ! grep -RIn --exclude-dir=.git --exclude-dir=build "BEGIN PRIVATE KEY" . || exit 1

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Release APK
        run: gradle --no-daemon assembleRelease

      - name: Release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/test/**/*.xml

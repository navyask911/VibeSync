name: VibeSync Android CI
# Release gate: source, JVM UI tests, on-device Compose UI tests, signing and packaging must pass.

on:
  push:
    branches:
      - main
      - vibesync-production
      - vibesync-hardening-2026-10-07
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: vibesync-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Secret scan
        run: |
          set -o pipefail
          if find . -type f               \( -name "*.kt" -o -name "*.java" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.xml" -o -name "*.properties" \)               ! -path "./.git/*"               ! -path "./source-archive/*"               ! -path "./.github/*"               ! -path "./build/*"               ! -path "./app/build/*"               ! -path "./app/google-services.json"               -print0 | xargs -0 -r grep -nH -E "\"private_key\"[[:space:]]*:[[:space:]]*\"-----BEGIN|AIzaSy[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" 2>/dev/null; then
            echo "Credential value pattern found in application source"
            exit 1
          fi

      - name: JVM unit + Compose UI tests
        run: gradle --no-daemon test

      - name: On-device Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect"
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is required for the release gate."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "STORE_PASSWORD and KEY_PASSWORD secrets are required for the release gate."
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/vibesync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> "$GITHUB_ENV"

      - name: Release APK
        run: gradle --no-daemon assembleRelease

      - name: Release AAB
        run: gradle --no-daemon bundleRelease

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/*.apk
          test -s app/build/outputs/bundle/release/*.aab
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/test/**/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/outputs/connected_android_test_additional_output/**/*

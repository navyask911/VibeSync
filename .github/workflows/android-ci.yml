name: VibeSync Android Release CI
# Release verification deliberately uses JVM tests plus signed APK/AAB packaging; no emulator gate.
# Primary release gate: source, JVM/Compose tests, signing, APK/AAB packaging and artifact verification.

on:
  push:
    branches:
      - main
      - vibesync-production
      - vibesync-hardening-2026-10-07
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: vibesync-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache/setup
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Secret scan
        run: |
          set -o pipefail
          if find . -type f \
              \( -name "*.kt" -o -name "*.java" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.xml" -o -name "*.properties" \) \
              ! -path "./.git/*" \
              ! -path "./source-archive/*" \
              ! -path "./.github/*" \
              ! -path "./build/*" \
              ! -path "./app/build/*" \
              ! -path "./app/google-services.json" \
              -print0 | xargs -0 -r grep -nH -E "\"private_key\"[[:space:]]*:[[:space:]]*\"-----BEGIN|AIzaSy[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" 2>/dev/null; then
            echo "Credential value pattern found in application source"
            exit 1
          fi

      - name: JVM unit + Compose UI tests
        run: ./gradlew --no-daemon -Dkotlin.compiler.execution.strategy=in-process clean test --rerun-tasks

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is required for the signed release gate."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "KEYSTORE_PASSWORD and KEY_PASSWORD secrets are required for the signed release gate."
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/vibesync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon -Dkotlin.compiler.execution.strategy=in-process assembleRelease --rerun-tasks

      - name: Build signed release AAB
        run: ./gradlew --no-daemon -Dkotlin.compiler.execution.strategy=in-process bundleRelease --rerun-tasks

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          APK=(app/build/outputs/apk/release/*.apk)
          AAB=(app/build/outputs/bundle/release/*.aab)

          test -f "${APK[0]}"
          test -f "${AAB[0]}"

          echo "Release APK:"
          ls -lh "${APK[0]}"

          echo "Release AAB:"
          ls -lh "${AAB[0]}"

      - name: Upload APK, AAB and test reports
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android-Release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/test/**/*.xml

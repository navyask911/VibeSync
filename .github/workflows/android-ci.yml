name: VibeSync Android CI
# Hardened release gate: build must pass before artifacts are published

on:
  push:
    branches:
      - main
      - vibesync-production
      - vibesync-hardening-2026-10-07
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: vibesync-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" ] ||              [ ! -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" ]; then
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Android SDK 35/build-tools 35 already installed on runner."
          fi

      - name: Secret scan
        run: |
          set -o pipefail
          # Scan source/config for credential *values*. Variable names and parsing patterns are not secrets.
          if find . -type f \
              \( -name "*.kt" -o -name "*.java" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.xml" -o -name "*.properties" \) \
              ! -path "./.git/*" \
              ! -path "./source-archive/*" \
              ! -path "./.github/*" \
              ! -path "./build/*" \
              ! -path "./app/build/*" \
              ! -path "./app/google-services.json" \
              -print0 | xargs -0 -r grep -nH -E "\"private_key\"[[:space:]]*:[[:space:]]*\"-----BEGIN|AIzaSy[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" 2>/dev/null; then
            echo "Credential value pattern found in application source"
            exit 1
          fi
      - name: Unit tests
        run: gradle --no-daemon test

      - name: Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Release APK
        run: gradle --no-daemon assembleRelease

      - name: Release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: VibeSync-Android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/test/**/*.xml

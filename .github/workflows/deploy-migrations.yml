name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
      - fix/release-startup-icons-ci
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: imhcbgpvjwersbnlgwzq

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Initialize Supabase CLI metadata
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link production project
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link             --project-ref "$SUPABASE_PROJECT_ID"             --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect linked migration history
        run: supabase migration list --linked

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

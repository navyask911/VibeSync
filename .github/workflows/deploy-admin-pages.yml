name: Deploy VibeSync Admin Pages

on:
  push:
    branches:
      - main
      - fix/release-startup-icons-ci
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vibesync-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static portal files
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < admin-web/CNAME)" = "admin.vibesync.social"
          node --input-type=module --check < admin-web/app.js
          grep -q "Content-Security-Policy" admin-web/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Inject public Supabase browser configuration
        shell: bash
        run: |
          set -euo pipefail
          project_url="${SUPABASE_URL:-https://imhcbgpvjwersbnlgwzq.supabase.co}"
          if [[ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            config="$(jq -cn --arg url "$project_url" --arg key "$SUPABASE_PUBLISHABLE_KEY" '{supabaseUrl:$url,supabaseAnonKey:$key}')"
            printf 'window.VIBESYNC_CONFIG = Object.freeze(%s);\n' "$config" > admin-web/config.js
            echo "Configured the deployment artifact with the public Supabase key."
          else
            echo "::warning::SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY) repository variable is missing. Pages deploys with sign-in disabled."
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

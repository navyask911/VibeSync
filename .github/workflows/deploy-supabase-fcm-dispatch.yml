name: Deploy Supabase FCM Dispatch

on:
  push:
    branches:
      - main
      - vibesync-hardening-2026-10-07
      - fix/release-startup-icons-ci
    paths:
      - 'supabase/functions/vibesync-fcm-dispatch/**'
      - 'supabase/functions/vibesync-business-broadcast/**'
      - 'supabase/functions/vibesync-wallet-payment/**'
      - '.github/workflows/deploy-supabase-fcm-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-fcm-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync FCM credential and deploy Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: imhcbgpvjwersbnlgwzq
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::Missing GitHub repository secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          node -e '
            try {
              const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
              if (!account.client_email || !account.private_key || !account.project_id) process.exit(2);
              if (account.project_id !== "vibesync-chat-social-connect") {
                console.error("FIREBASE_SERVICE_ACCOUNT belongs to a different Google Cloud project.");
                process.exit(3);
              }
            } catch (_) {
              process.exit(2);
            }
          ' || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT must contain the complete Google service-account JSON."
            exit 1
          }

      - name: Store Firebase service account in Supabase Edge secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT"
          if [[ -n "${RAZORPAY_KEY_ID:-}" && -n "${RAZORPAY_KEY_SECRET:-}" ]]; then
            supabase secrets set \
              --project-ref "$SUPABASE_PROJECT_REF" \
              "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" \
              "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET"
          else
            echo "::warning::Razorpay key secrets are not configured; the payment Edge Function will fail closed until RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are added."
          fi

      - name: Deploy data-only FCM dispatch Edge Function
        run: >-
          supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt
          vibesync-fcm-dispatch

      - name: Deploy business broadcast Edge Function
        run: >-
          supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt
          vibesync-business-broadcast

      - name: Deploy Razorpay payment Edge Function
        run: >-
          supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt
          vibesync-wallet-payment

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode. For more details see
# https://docs.gradle.org/current/userguide/performance.html#parallel
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that the library's R class includes only its own resources.
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Use in-process Kotlin compilation to avoid compiler daemon connection/reuse issues in CI.
kotlin.compiler.execution.strategy=in-process
# Use the legacy KSP implementation with the current Kotlin/Room compiler combination.
ksp.use.ksp2=true
# Keep KSP processing out of isolated worker API execution in headless CI.
ksp.use.worker.api=false
# Keep Kotlin daemon JVMs headless so annotation processing cannot initialize AWT event queues.
kotlin.daemon.jvm.options=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
